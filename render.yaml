# Render Blueprint — deploys the FastAPI backend as a free web service with a
# free managed Postgres database, so the app has real persistent storage
# instead of an on-disk SQLite file (Render's free web services have no
# persistent disk, so a plain SQLite file gets wiped on every restart/redeploy).
#
# To use: push this file to the repo, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at this repo. Render reads this file
# and provisions both resources for you.
services:
  - type: web
    name: gramvyapaar-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gramvyapaar-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      # Set this to your deployed frontend's URL (e.g. https://gramvyapaar.vercel.app)
      # after you deploy the frontend on Vercel — CORS needs an exact origin match.
      - key: FRONTEND_ORIGIN
        sync: false

databases:
  - name: gramvyapaar-db
    plan: free
    databaseName: gramvyapaar
    user: gramvyapaar
